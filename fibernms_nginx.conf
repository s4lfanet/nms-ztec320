server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    location /spa/ {
        alias /opt/fibernms/frontend/dist/;
        try_files $uri /spa/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /spa/assets/ {
        alias /opt/fibernms/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /spa/pwa/ {
        alias /opt/fibernms/frontend/dist/pwa/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /static/ {
        alias /opt/fibernms/static/;
        expires 1h;
    }

    # ── FastAPI Async API (Swagger docs, health, WebSocket) ──
    location /docs {
        proxy_pass http://127.0.0.1:8765/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8765/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8765/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://127.0.0.1:8765/health;
        proxy_set_header Host $host;
    }

    # ── WebSocket endpoints ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8765/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
