name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
      - run: npm run build
      - name: Committed dist must match the source
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist | head -20
            echo "::error::frontend/dist is out of date. Run 'cd frontend && npm ci && npm run build' and commit dist/."
            exit 1
          fi

  ui-responsive:
    # Buka semua halaman di 360–1920 px dengan data contoh; gagal bila ada
    # halaman yang melebar keluar layar. Memakai frontend/dist yang di-commit.
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-ui-secret-key
      INTERNAL_API_KEY: ci-ui-internal-key
      DATABASE_URL: sqlite:////tmp/ui-check.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Seed + start server
        run: |
          # password akun uji dibuat acak per run (tidak ada kredensial di repo)
          pw=$(openssl rand -hex 16); echo "::add-mask::$pw"; echo "UI_CHECK_PASSWORD=$pw" >> "$GITHUB_ENV"
          export UI_CHECK_PASSWORD=$pw
          python scripts/ui_check/seed.py
          nohup python scripts/ui_check/serve.py > /tmp/ui-serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:5055/login && break; sleep 1; done
      - name: Check responsive layout
        run: python scripts/ui_check/check.py --shots /tmp/ui-shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/ui-shots
          retention-days: 7
      - name: Server log
        if: failure()
        run: tail -100 /tmp/ui-serve.log

  test:
    runs-on: ubuntu-latest

    env:
      FLASK_ENV: testing
      INTERNAL_API_KEY: ci-test-internal-key
      SECRET_KEY: ci-test-secret-key

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Dependency audit (informational)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Smoke test imports
        run: |
          python -c "from app import app; print('app import OK')"
          python -c "from api_async import fastapi_app; print('api_async import OK')"

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/test_output.txt
          echo "## Test Output (last 50 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 /tmp/test_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Run: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
