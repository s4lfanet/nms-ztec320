# ============================================================
# Salfanet NMS — Taskfile (task runner)
# ============================================================
# Usage:
#   task test          — Run unit tests
#   task load-test     — Run k6 load tests
#   task load-test-ws  — Run k6 WebSocket tests
#   task build         — Build frontend
#   task deploy        — Deploy to VPS
#   task metrics       — Check Prometheus metrics
# ============================================================

version: '3'

vars:
  VPS_IP: 192.168.54.131
  VPS_USER: root
  VPS_PATH: /opt/salfanet-nms

tasks:
  test:
    desc: Run Python unit tests
    cmds:
      - py -3 -m pytest tests/ -v

  load-test:
    desc: Run k6 API load tests
    cmds:
      - k6 run --vus 20 --duration 30s tests/load/test_api.js

  load-test-ws:
    desc: Run k6 WebSocket load tests
    cmds:
      - k6 run --vus 50 --duration 60s tests/load/test_websocket.js

  build:
    desc: Build frontend for production
    dir: frontend
    cmds:
      - npm run build

  deploy:
    desc: Deploy frontend to VPS
    cmds:
      - task build
      - cmd: echo y | plink -pw seven7890 root@{{.VPS_IP}} "rm -rf {{.VPS_PATH}}/frontend/dist/assets/*"
      - cmd: echo y | pscp -pw seven7890 -r frontend/dist/assets root@{{.VPS_IP}}:{{.VPS_PATH}}/frontend/dist/
      - cmd: echo y | pscp -pw seven7890 frontend/dist/index.html root@{{.VPS_IP}}:{{.VPS_PATH}}/frontend/dist/index.html
      - cmd: echo y | plink -pw seven7890 root@{{.VPS_IP}} "systemctl restart salfanet-nms"

  metrics:
    desc: Check Prometheus metrics
    cmds:
      - curl -s http://{{.VPS_IP}}/metrics | head -50

  sync:
    desc: Trigger OLT sync
    cmds:
      - curl -s -X POST http://{{.VPS_IP}}/api/sync-all -H "Content-Type: application/json" -d '{}'
