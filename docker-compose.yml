# Salfanet NMS — full stack via Docker Compose.
# Services: app (Flask+FastAPI), postgres, redis, wa_gateway (Baileys), nginx.
# Usage: cp .env.docker.example .env.docker && docker compose --env-file .env.docker up -d --build
name: salfanet-nms

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://nms:${POSTGRES_PASSWORD:-nms}@postgres:5432/salfanet_nms
      REDIS_URL: redis://redis:6379/0
      WA_GATEWAY_URL: http://wa_gateway:3001
      FLASK_ENV: production
    volumes:
      # SQLite fallback path + backups + audit-log archives (still used when
      # DATABASE_URL is commented out in .env.docker)
      - nms_instance:/app/backend/instance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks: [nms]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nms}
      POSTGRES_DB: salfanet_nms
    volumes:
      - nms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nms -d salfanet_nms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [nms]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    networks: [nms]

  wa_gateway:
    build:
      context: ./wa_gateway
      dockerfile: Dockerfile
    environment:
      WA_GATEWAY_PORT: 3001
      WA_GATEWAY_HOST: 0.0.0.0  # private compose network only; port is not published
    volumes:
      - wa_session:/app/session
    restart: unless-stopped
    networks: [nms]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Frontend is the committed dist/ — no node build step needed.
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
      - wa_gateway
    restart: unless-stopped
    networks: [nms]

volumes:
  nms_instance:
  nms_pgdata:
  wa_session:

networks:
  nms:
    driver: bridge
