# ============================================================
# Salfanet NMS — Docker Compose
# ============================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f backend    # View backend logs
#   docker compose down               # Stop all services
#   docker compose down -v            # Stop + remove volumes (DANGER: deletes data)
#
# Services:
#   - backend:  Flask + FastAPI (hybrid server)
#   - postgres: PostgreSQL database
#   - nginx:    Reverse proxy (production)
# ============================================================

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: nms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: salfanet_nms
      POSTGRES_USER: nms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nms_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nms_user -d salfanet_nms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend (Flask + FastAPI hybrid) ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://nms_user:${POSTGRES_PASSWORD:-nms_secret_2026}@postgres:5432/salfanet_nms
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      HOST: "0.0.0.0"
      PORT: "5000"
      WS_PORT: "8765"
      SESSION_COOKIE_SECURE: "0"
      PREFERRED_URL_SCHEME: http
    volumes:
      - nms_instance:/app/instance
    ports:
      - "5000:5000"   # Flask HTTP API
      - "8765:8765"   # FastAPI WebSocket

  # --- Nginx Reverse Proxy (production) ---
  nginx:
    image: nginx:alpine
    container_name: nms-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-fibernms.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/fibernms/frontend/dist:ro
    profiles:
      - production

volumes:
  postgres_data:
  nms_instance:
