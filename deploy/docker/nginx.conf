# Salfanet NMS — nginx for Docker Compose.
# Serves committed frontend/dist and proxies /api -> app:5000, /ws -> app:8765.

upstream nms_flask {
    server app:5000;
}

upstream nms_ws {
    server app:8765;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed vite assets — long cache, immutable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket (FastAPI) — needs Upgrade headers + no buffering.
    location /ws/ {
        proxy_pass http://nms_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://nms_flask;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logo / uploaded files served by Flask static route.
    location /static/ {
        proxy_pass http://nms_flask;
        proxy_set_header Host $host;
    }

    # SPA fallback — every other path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
