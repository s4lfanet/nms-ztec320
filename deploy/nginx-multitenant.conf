# Nginx config for multi-tenant FiberNMS with wildcard subdomain
# Place in /etc/nginx/sites-available/fibernms and symlink to sites-enabled/

# Wildcard subdomain for tenant access (e.g. company1.fibernms.id)
server {
    listen 80;
    server_name *.fibernms.id fibernms.id;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name *.fibernms.id fibernms.id;

    # SSL cert (wildcard cert required for *.fibernms.id)
    ssl_certificate /etc/letsencrypt/live/fibernms.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fibernms.id/privkey.pem;

    # Frontend static files (SPA)
    root /opt/fibernms/frontend/dist;
    index index.html;

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── FastAPI Async API (Swagger docs, health, WebSocket) ──
    location /docs {
        proxy_pass http://127.0.0.1:8765/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8765/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8765/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://127.0.0.1:8765/health;
        proxy_set_header Host $host;
    }

    # ── WebSocket endpoints ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8765/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API and backend routes proxy to Flask
    location ~ ^/(api|dashboard|all-onus|add-onu|settings|customization|template|profile|users|logs|ftth|spa) {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
